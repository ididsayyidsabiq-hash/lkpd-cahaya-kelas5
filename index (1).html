<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: satu kolom buku catatan detektif; kartu hanya untuk kasus dan kotak gambar, selebihnya mengalir seperti lembar kerja. */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#14214A; --muted:#4C5886; --line:#D3DAEE;
  --accent:#FFC83D; --accent-ink:#14214A; --blank:#FFF8DC; --blank-line:#B88A00;
  --focus:#2D6BFF; --ok:#17794A; --warn:#A8480A; --chip:#E6EBF8;
  --font-display:'Fredoka','Trebuchet MS',Arial,sans-serif;
  --font-body:'Nunito Sans',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1226; --surface:#141E3D; --ink:#EAF0FF; --muted:#A8B6E0; --line:#2A3A6B;
    --accent:#FFC83D; --accent-ink:#14214A; --blank:#2A2A1E; --blank-line:#FFC83D;
    --focus:#7FA6FF; --ok:#5BD69A; --warn:#FFB36B; --chip:#1E2C57; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1226; --surface:#141E3D; --ink:#EAF0FF; --muted:#A8B6E0; --line:#2A3A6B;
  --accent:#FFC83D; --accent-ink:#14214A; --blank:#2A2A1E; --blank-line:#FFC83D;
  --focus:#7FA6FF; --ok:#5BD69A; --warn:#FFB36B; --chip:#1E2C57; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.beam{height:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:linear-gradient(90deg,#E5484D,#F97316,#FFC83D,#2FB36D,#2D8CFF,#4C4FD6,#8B5CF6)}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{padding-top:28px;display:flex;flex-direction:column;gap:6px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px)}
h2{font-size:clamp(24px,4vw,30px)}
h3{font-size:20px}
p{margin:0}
.sub{color:var(--muted)}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs button{font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.id-row{display:grid;grid-template-columns:1fr 200px;gap:16px}
@media (max-width:640px){.id-row{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;min-width:0}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.arrow{color:var(--muted)}
.pos-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;align-self:flex-start}
article{display:flex;flex-direction:column;gap:24px}
section.blk{display:flex;flex-direction:column;gap:10px}
section.blk>h3{display:flex;align-items:center;gap:10px}
ul.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
ul.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.steps label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
ul.steps input{width:22px;height:22px;margin-top:3px;accent-color:var(--focus);flex:none}
.sentence{line-height:2.3}
.blank{font:inherit;color:var(--ink);background:var(--blank);border:0;border-bottom:2px dashed var(--blank-line);border-radius:6px 6px 0 0;padding:2px 8px;min-width:12ch;width:18ch;max-width:100%;margin-inline:2px}
select.blank{width:auto;min-width:12ch}
textarea.area{min-height:84px;resize:vertical;background:var(--blank);border-color:var(--blank-line);border-style:dashed}
.q{font-weight:600}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{font-weight:700}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slotwrap{position:relative}
.slots figcaption{flex:1}
.slot{position:relative;width:100%;aspect-ratio:4/3;border:3px dashed var(--blank-line);background:var(--blank);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;min-width:0;overflow:hidden}
.slot.over{border-style:solid;border-color:var(--focus);background:var(--chip)}
.slot.filled{border-style:solid;border-color:var(--ok);background:#fff;padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.x{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:20px;line-height:1;font-weight:700;cursor:pointer;padding:0}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;max-height:310px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pic{padding:0;border:2px solid var(--line);border-radius:10px;background:#fff;aspect-ratio:4/3;cursor:grab;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-width:0}
.pic img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pic[aria-pressed="true"]{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus)}
.ghost{position:fixed;z-index:1000;width:120px;pointer-events:none;opacity:.92;transform:translate(-50%,-50%);border:3px solid var(--focus);border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-block}
.status{font-size:15px;color:var(--muted)}
.status.err{color:var(--warn);font-weight:700}
.done{background:var(--chip);border-left:6px solid var(--ok);padding:12px 16px;border-radius:10px;font-weight:700}
.note{font-size:15px;color:var(--muted)}
/* Rekap */
.rec{display:flex;flex-direction:column;gap:10px}
details.g{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.g summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:90px 1fr auto auto;gap:12px;align-items:center;padding:14px 16px}
details.g summary::-webkit-details-marker{display:none}
@media (max-width:640px){details.g summary{grid-template-columns:70px 1fr auto}.hide-s{display:none}}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.gbody{padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.gbody dl{margin:0;display:flex;flex-direction:column;gap:8px}
.gbody dt{font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gbody dd{margin:0}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs img{width:100%;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.score{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:end}
@media (max-width:640px){.score{grid-template-columns:1fr}}
.nilai{font-family:var(--font-display);font-size:30px;font-weight:600}
textarea.manual{min-height:140px;font-size:14px}
footer{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Lembar hasil (layar + cetak/PDF) */
#report{display:none;position:fixed;inset:0;z-index:900;background:#e9ecf5;overflow:auto;padding:16px;color:#14214A}
#report.on{display:block}
.rbar{max-width:794px;margin:0 auto 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rbar .hint{font-size:14px;color:#4C5886;flex:1;min-width:200px}
.paper{max-width:794px;margin:0 auto;background:#fff;color:#14214A;border-radius:6px;padding:28px 30px;box-shadow:0 2px 12px rgba(20,33,74,.18);font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:12px}
.paper .rb{height:6px;border-radius:3px;background:linear-gradient(90deg,#E5484D,#F97316,#FFC83D,#2FB36D,#2D8CFF,#4C4FD6,#8B5CF6)}
.paper h1{font-size:26px}.paper h2{font-size:20px}.paper h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#4C5886;margin-top:4px}
.paper .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.paper .meta b{font-weight:700}
.paper ul{margin:0;padding-left:20px}
.paper ul.cek{list-style:none;padding:0}
.paper .ans{font-weight:700;color:#0B3FB5;border-bottom:2px solid #0B3FB5;padding:0 3px;background:#EEF3FF}
.paper .empty{color:#B00020;border-bottom:2px dotted #B00020;padding:0 3px}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.paper figure{margin:0;display:flex;flex-direction:column;gap:6px;break-inside:avoid}
.paper figure .frame{border:2px solid #D3DAEE;border-radius:10px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.paper figure img{width:100%;height:100%;object-fit:contain}
.paper figcaption{font-weight:700;font-size:14px}
.paper .blk{break-inside:avoid}
.paper .foot{font-size:12px;color:#4C5886;border-top:1px solid #D3DAEE;padding-top:8px}
@media (max-width:560px){.paper{padding:18px 16px}.paper .two{grid-template-columns:1fr}}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff!important}}
@media print{
  body>*:not(#report){display:none!important}
  #report{display:block!important;position:static;background:#fff;padding:0;overflow:visible}
  .rbar{display:none!important}
  .paper{max-width:none;box-shadow:none;border-radius:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper .two{grid-template-columns:1fr 1fr!important}
}
</style></head><body>

</main>

 kasus:"Suatu siang yang terik, Ujang beristirahat sambil menikmati es goyobod yang segar. Saat memperhatikan gelasnya dari samping, ia kaget melihat sedotan di dalam gelas terlihat bengkok dan seperti patah. Apakah sedotannya tertukar dengan sedotan ajaib? Yuk, bantu Ujang memecahkan misteri ini lewat eksperimen!",
 tujuan:"Membuktikan dan menganalisis pembiasan cahaya (cahaya dapat dibelokkan) dalam kehidupan sehari-hari.",
 alat:["1 buah gelas bening (kaca atau plastik transparan)","Air bening secukupnya","1 pensil atau sedotan yang cukup panjang"],
 langkah:["Letakkan gelas bening yang masih kosong di bilik Sifat Cahaya 6.","Masukkan pensil ke dalam gelas kosong. Amati pensil dari samping gelas. Apakah ada yang aneh?","Keluarkan pensil dan gelasnya, lalu tuangkan air hingga sekitar 3/4 bagian gelas.","Masukkan kembali gelas berisi air ke bilik, lalu masukkan pensil atau sedotan.","Amati dari samping gelas (sejajar dengan mata). Perhatikan bagian pensil di atas air dan di dalam air. Apa yang terjadi?"],
 catatan:["?Apa perbedaan yang kamu lihat pada pensil atau sedotan sebelum dan sesudah gelas diisi air?","?Menurut pengamatanmu, mengapa pensil di dalam air bisa terlihat seperti patah padahal sebenarnya utuh? (Petunjuk: ingat pelajaran tentang sifat cahaya saat melewati udara lalu masuk ke air.)"],
 analisis:"",
 kesimpulan:"Sedotan milik Ujang tidak benar-benar patah. Hal ini membuktikan bahwa cahaya memiliki sifat dapat {}. Peristiwa ini terjadi karena cahaya merambat melalui dua zat yang berbeda, yaitu dari {} ke dalam {}.",
 gambar:[["Pensil di gelas kosong","Bentuk pensil terlihat {}"],["Pensil di gelas berisi air","Bentuk pensil terlihat {}"]]}
];

function fillNodes(text,prefix){
  const frag=document.createDocumentFragment();let b=0;
  text.split(/(\{[^}]*\})/).forEach(p=>{
    if(p.length>1&&p[0]==='{'&&p.endsWith('}')){
      const key=prefix+'.'+(b++),inner=p.slice(1,-1);let f;
      if(inner.includes('|')){f=el('select',{class:'blank','data-k':key,'aria-label':'Pilihan '+b},el('option',{value:'',text:'pilih'}),...inner.split('|').map(o=>el('option',{value:o,text:o})))}
      else{f=el('input',{class:'blank',type:'text','data-k':key,autocomplete:'off','aria-label':'Isian '+b})}
      f.value=S.a[key]||'';
      f.addEventListener('input',onAns);f.addEventListener('change',onAns);
      frag.append(f);
    }else if(p){frag.append(p)}
  });
  return frag;
}

    const x=el('button',{type:'button',class:'x',text:'×','aria-label':'Kosongkan kotak '+(i+1)});
    const wrap=el('div',{class:'slotwrap'},btn,x);
    const paint=()=>{const id=validId(S.d[i]);btn.classList.toggle('filled',!!id);
      btn.replaceChildren(id?el('img',{src:imgSrc(id),alt:IMG[id]}):el('span',{text:'Seret gambar ke sini'}));
      btn.setAttribute('aria-label','Kotak '+(i+1)+(id?': '+IMG[id]:', masih kosong'));x.hidden=!id};
    const put=id=>{S.d[i]=id;paint();queueSave()};
    btn.addEventListener('click',()=>{if(sel){put(sel);setSel('')}else hint.textContent='Pilih dulu sebuah gambar dari kumpulan di bawah.'});
    x.addEventListener('click',()=>put(''));
    paint();return{wrap,btn,put};
  });
  const ids=shuffle(Object.keys(IMG),K);
  const pics=ids.map(id=>{
    const b=el('button',{type:'button',class:'pic','aria-pressed':'false','aria-label':'Gambar: '+IMG[id]},el('img',{src:imgSrc(id),alt:'',draggable:'false'}));
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('click',()=>{if(justDragged)return;setSel(sel===id?'':id)});
    b.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button)return;md=id;dx=e.clientX;dy=e.clientY});
    b.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;clearTimeout(lp);lp=setTimeout(()=>{begin(id,tx,ty);try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}},220)},{passive:true});
    b.addEventListener('touchmove',e=>{const t=e.touches[0];if(ghost){e.preventDefault();mv(t.clientX,t.clientY);return}if(Math.hypot(t.clientX-tx,t.clientY-ty)>8)clearTimeout(lp)},{passive:false});
    const te=e=>{clearTimeout(lp);if(ghost){e.preventDefault();const t=e.changedTouches[0];finish(t.clientX,t.clientY,e.type==='touchcancel')}};
    b.addEventListener('touchend',te);b.addEventListener('touchcancel',te);
    return[b,id];
  });
  function setSel(id){sel=id;pics.forEach(([b,pid])=>b.setAttribute('aria-pressed',pid===id?'true':'false'));hint.textContent=id?'Gambar dipilih. Ketuk kotak tujuan untuk menaruhnya.':''}
  function hit(x,y){const t=document.elementFromPoint(x,y),b=t&&t.closest&&t.closest('.slot');slots.forEach(o=>o.btn.classList.toggle('over',o.btn===b));return slots.find(o=>o.btn===b)}
  function begin(id,x,y){dragId=id;ghost=el('div',{class:'ghost'},el('img',{src:imgSrc(id),alt:'',style:'width:100%;display:block'}));document.body.append(ghost);mv(x,y)}
  function mv(x,y){ghost.style.left=x+'px';ghost.style.top=y+'px';hit(x,y)}
  function finish(x,y,cancel){if(!ghost)return;const s=cancel?null:hit(x,y);ghost.remove();ghost=null;slots.forEach(o=>o.btn.classList.remove('over'));
    if(s){s.put(dragId);setSel('')}justDragged=true;setTimeout(()=>{justDragged=false},50)}
  document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!md)return;if(!ghost){if(Math.hypot(e.clientX-dx,e.clientY-dy)<6)return;begin(md,e.clientX,e.clientY)}else mv(e.clientX,e.clientY)},sig);
  document.addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;if(md&&ghost)finish(e.clientX,e.clientY);md=''},sig);
  const row=el('div',{class:'slots'},...[0,1].map(i=>el('figure',{},el('figcaption',{text:'Kotak '+(i+1)+': '+l.gambar[i][0]}),slots[i].wrap)));
  const bank=el('div',{class:'bank',role:'group','aria-label':'Kumpulan gambar'},...pics.map(p=>p[0]));
  const ket=el('div',{style:'display:flex;flex-direction:column;gap:10px'},el('p',{class:'q',text:'Keterangan gambar'}),...l.gambar.map((g,i)=>el('div',{},el('p',{class:'sub',text:'Kotak '+(i+1)+': '+g[0]}),el('p',{class:'sentence'},fillNodes(g[1],'g'+i)))));
  return{row,bank,hint,ket};
}

function render(){
  const l=L[K-1],root=$('#lkpd');root.replaceChildren();
  S.cek=l.langkah.map((_,i)=>!!S.cek[i]);
  const blk=(h,...c)=>el('section',{class:'blk'},el('h3',{text:h}),...c);
  const sent=(t,pre)=>el('p',{class:'sentence'},fillNodes(t,pre));
  const steps=el('ul',{class:'steps'},...l.langkah.map((t,i)=>{
    const cb=el('input',{type:'checkbox','aria-label':'Langkah '+(i+1)+' selesai'});cb.checked=S.cek[i];
    cb.addEventListener('change',()=>{S.cek[i]=cb.checked;queueSave()});
    return el('li',{},el('label',{},cb,el('span',{text:t})));
  }));
  const cat=el('div',{style:'display:flex;flex-direction:column;gap:14px'},...l.catatan.map((t,i)=>{
    if(t[0]==='?'){
      const ta=el('textarea',{class:'area','data-k':'c'+i+'.0','aria-label':'Jawaban catatan '+(i+1),rows:'3'});ta.value=S.a['c'+i+'.0']||'';ta.addEventListener('input',onAns);
      return el('div',{style:'display:flex;flex-direction:column;gap:6px'},el('p',{class:'q',text:t.slice(1)}),ta);
    }
    return sent(t,'c'+i);
  }));
  const pic=picsUI(l);
  const submit=el('button',{class:'btn',type:'button',id:'btn-send',text:S.status==='terkirim'?'Kirim ulang jawaban':'Kirim jawaban kelompok'});
  submit.addEventListener('click',async()=>{
    if(!S.nama.trim()){setStat('Tulis nama-nama detektif dulu.',true);$('#nama').focus();return}
    if(!ENDPOINT){setStat('Pengiriman ke Google Sheet belum diaktifkan guru. Gunakan Salin jawaban.',true);return}
    submit.disabled=true;setStat('Mengirim…');
    try{await send();S.status='terkirim';persist();$('#done').hidden=false;submit.textContent='Kirim ulang jawaban';setStat('Terkirim pukul '+clock())}
    catch(e){setStat('Belum terkirim. Periksa internet, lalu klik lagi.',true)}
    finally{submit.disabled=false}
  });
  const view=el('button',{class:'btn alt',type:'button',text:'Lihat LKPD terisi (PDF)'});
  view.addEventListener('click',openReport);
  const copy=el('button',{class:'btn alt',type:'button',text:'Salin jawaban'});
  copy.addEventListener('click',async()=>{const ok=await copyText(plainText());setStat(ok?'Jawaban disalin.':'Salin manual: tekan lama teks di bawah.',!ok)});
  root.append(
    el('span',{class:'pos-tag',text:'Pos 2 · LKPD '+K}),
    el('h2',{text:l.j}),
    el('div',{class:'card'},el('h3',{text:'Kasus hari ini'}),el('p',{text:l.kasus})),
    blk('Tujuan penyelidikan',el('p',{text:l.tujuan})),
    blk('Alat dan bahan',el('ul',{class:'plain'},...l.alat.map(a=>el('li',{text:a})))),
    blk('Langkah penyelidikan',steps),
    blk('Buku catatan detektif',cat,...(l.analisis?[el('p',{class:'q',text:'Analisis kasus'}),sent(l.analisis,'an')]:[])),
    blk('Kesimpulan',sent(l.kesimpulan,'ks')),
    el('span',{class:'pos-tag',text:'Pos 3'}),
    blk('Pilih gambar yang sesuai hasil percobaanmu!',el('p',{class:'sub',text:'Tahan gambar lalu seret ke kotak yang cocok. Bisa juga ketuk gambar, lalu ketuk kotaknya. Setelah itu lengkapi keterangannya.'}),pic.row,pic.bank,pic.hint,pic.ket),
    el('div',{class:'actions'},submit,view,copy,el('span',{id:'stat',class:'status',role:'status'})),
    el('p',{id:'done',class:'done',text:'Jawaban kelompok sudah terkirim. Kerja bagus, detektif!',hidden:''})
  );
  if(S.status==='terkirim')$('#done').hidden=false;
}
function plainText(){
  const l=L[K-1],a=S.a;
  const lines=['LKPD '+K+' · '+l.j,'Detektif: '+(S.nama||'-'),''];
  l.catatan.forEach((t,i)=>lines.push('- '+(t[0]==='?'?t.slice(1)+' '+(a['c'+i+'.0']||'……'):sentence(t,'c'+i,a))));
  if(l.analisis)lines.push('Analisis: '+sentence(l.analisis,'an',a));
  lines.push('Kesimpulan: '+sentence(l.kesimpulan,'ks',a));
  l.gambar.forEach((g,i)=>lines.push(g[0]+': '+sentence(g[1],'g'+i,a)+' [gambar: '+(validId(S.d[i])?IMG[S.d[i]]:'belum dipilih')+']'));
  return lines.join('\n');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  const m=$('#manual');m.value=t;m.hidden=false;m.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}
  return ok;
}


/* ---------- Lembar LKPD terisi (untuk PDF) ---------- */
function filled(text,prefix){
  const frag=document.createDocumentFragment();let b=0;
  text.split(/(\{[^}]*\})/).forEach(p=>{
    if(p.length>1&&p[0]==='{'&&p.endsWith('}')){
      const v=(S.a[prefix+'.'+(b++)]||'').trim();
      frag.append(el('span',{class:v?'ans':'empty',text:v||'……………'}));
    }else if(p)frag.append(p);
  });
  return frag;
}
function openReport(){
  if(!K)return;
  const l=L[K-1],a=S.a;
  let box=$('#report');if(box)box.remove();
  box=el('div',{id:'report',role:'dialog','aria-label':'LKPD terisi'});
  const title='LKPD Kelompok '+K+' - '+l.j;
  const bar=el('div',{class:'rbar'},
    el('button',{class:'btn',type:'button',text:'Simpan sebagai PDF / Cetak'}),
    el('button',{class:'btn alt',type:'button',text:'Tutup'}),
    el('span',{class:'hint',text:'Di jendela cetak, pilih tujuan "Simpan sebagai PDF". Gambar dan jawaban ikut tercetak.'}));
  bar.children[0].addEventListener('click',()=>{const old=document.title;document.title=title;try{window.print()}catch(e){alert('Perangkat ini tidak bisa mencetak. Ambil tangkapan layar halaman ini.')}setTimeout(()=>{document.title=old},1500)});
  bar.children[1].addEventListener('click',()=>{box.remove();document.body.style.overflow=''});
  const sec=(h,...c)=>el('div',{class:'blk'},el('h3',{text:h}),...c);
  const cat=l.catatan.map((t,i)=>{
    if(t[0]==='?'){const v=(a['c'+i+'.0']||'').trim();return el('p',{},el('b',{text:t.slice(1)}),el('br'),el('span',{class:v?'ans':'empty',text:v||'……………'}))}
    return el('p',{},filled(t,'c'+i));
  });
  const paper=el('div',{class:'paper'},
    el('div',{class:'rb'}),
    el('div',{},el('p',{class:'kicker',text:'IPAS Kelas V · Misteri Cahaya di Sekitar Kita'}),el('h1',{text:'LKPD Detektif Cahaya'})),
    el('div',{class:'meta'},el('b',{text:'Kelompok'}),el('span',{text:String(K)+' · '+route(K).join(' → ')}),el('b',{text:'Detektif'}),el('span',{text:S.nama||'-'}),el('b',{text:'Kasus'}),el('span',{text:l.j})),
    sec('Kasus hari ini',el('p',{text:l.kasus})),
    sec('Tujuan penyelidikan',el('p',{text:l.tujuan})),
    sec('Alat dan bahan',el('ul',{},...l.alat.map(x=>el('li',{text:x})))),
    sec('Langkah penyelidikan',el('ul',{class:'cek'},...l.langkah.map((t,i)=>el('li',{text:(S.cek[i]?'☑ ':'☐ ')+t})))),
    sec('Buku catatan detektif',...cat,...(l.analisis?[el('p',{},el('b',{text:'Analisis kasus: '}),filled(l.analisis,'an'))]:[])),
    sec('Kesimpulan',el('p',{},filled(l.kesimpulan,'ks'))),
    sec('Pos 3 · Gambar hasil percobaan',el('div',{class:'two'},...l.gambar.map((g,i)=>{
      const id=validId(S.d[i]);
      return el('figure',{},el('figcaption',{text:'Kotak '+(i+1)+': '+g[0]}),
        el('div',{class:'frame'},id?el('img',{src:imgSrc(id),alt:IMG[id]}):el('span',{class:'empty',text:'Belum memilih gambar'})),
        el('p',{},filled(g[1],'g'+i)));
    }))),
    el('p',{class:'foot',text:'Praktik Baik Station Rotation · SDN 1 Karangsari · Dicetak '+new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'long',year:'numeric'})}));
  box.append(bar,paper);document.body.append(box);box.classList.add('on');box.scrollTop=0;
}

/* ---------- Pilih kelompok ---------- */
async function loadK(k){
  K=k;S=blank();
  $('#empty').hidden=!!k;$('#lkpd').hidden=!k;$('#route').hidden=!k;
  if(!k)return;
  const r=$('#route');r.replaceChildren(el('span',{class:'sub',text:'Rute kelompokmu:'}));
  route(k).forEach((p,i)=>{if(i)r.append(el('span',{class:'arrow',text:'→'}));r.append(el('span',{class:'chip',text:p}))});
  try{const raw=localStorage.getItem(lsKey(k));if(raw){const d=JSON.parse(raw);S={nama:d.nama||'',cek:d.cek||[],a:d.a||{},d:[validId((d.d||[])[0]),validId((d.d||[])[1])],status:d.status||'draf'}}}catch(e){}
  if(K!==k)return;
  $('#nama').value=S.nama;render();
}
$('#kel').addEventListener('change',e=>loadK(+e.target.value||0));
$('#nama').addEventListener('input',e=>{S.nama=e.target.value;queueSave()});

})();
</script>
